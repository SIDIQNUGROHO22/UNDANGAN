<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldPutri" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5d0"/>
      <stop offset="35%" stop-color="#e8c872"/>
      <stop offset="70%" stop-color="#c59239"/>
      <stop offset="100%" stop-color="#8c6117"/>
    </linearGradient>
    <filter id="goldShinePutri">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Siluet Wayang Kulit Dewi Ratih / Kamaratih (Tokoh Putri Anggun) -->
  <g fill="none" stroke="url(#goldPutri)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#goldShinePutri)">
    <!-- Mahkota Jamang Putri & Gelung Keling Lungsen -->
    <path d="M 145,65 C 130,45 135,20 155,10 C 175,0 190,15 185,35 C 195,30 205,40 200,55 C 190,75 165,75 145,65 Z" fill="rgba(218, 165, 32, 0.25)"/>
    <!-- Cunduk Mentul & Ronce Melati Mengurai -->
    <path d="M 175,10 L 190,-5 M 165,8 L 175,-12 M 185,15 L 202,0" stroke-width="2"/>
    <circle cx="190" cy="-5" r="4" fill="url(#goldPutri)"/>
    <circle cx="175" cy="-12" r="4" fill="url(#goldPutri)"/>
    <circle cx="202" cy="0" r="4" fill="url(#goldPutri)"/>
    <path d="M 185,55 C 205,80 200,120 195,150" stroke-dasharray="3,3"/>

    <!-- Wajah Luruh Anggun Putri Solo/Jogja -->
    <path d="M 135,78 C 122,88 118,102 120,114 C 124,122 135,125 145,122 L 152,112 L 158,88 Z" fill="rgba(218, 165, 32, 0.2)"/>
    <path d="M 116,98 Q 110,103 105,105"/>
    <path d="M 120,96 Q 126,94 130,98"/>

    <!-- Kemben / Dodot Putri & Kalung Bulan Sabit -->
    <path d="M 140,128 C 128,138 122,160 126,185 C 135,205 160,205 168,185 C 172,160 165,138 152,128 Z" fill="rgba(218, 165, 32, 0.2)"/>
    <circle cx="147" cy="165" r="7" fill="url(#goldPutri)"/>

    <!-- Lengan Lunglai Gemulai Putri Gandrung -->
    <path d="M 125,145 C 105,155 88,180 85,215 C 82,240 98,255 118,245 C 130,235 132,205 128,185"/>
    <path d="M 165,145 C 185,155 202,180 205,215 C 208,240 192,255 172,245 C 160,235 158,205 162,185"/>
    <!-- Sampur / Selendang Anggun yang Melambai -->
    <path d="M 118,245 C 95,270 75,320 70,390 C 85,385 105,370 125,310"/>
    <path d="M 172,245 C 195,270 215,320 220,390 C 205,385 185,370 165,310"/>

    <!-- Jarik Motif Sidoasih / Sidomukti Putri Keraton -->
    <path d="M 126,215 L 112,345 C 108,380 122,425 144,440 L 150,440 C 172,425 186,380 182,345 L 168,215 Z" fill="rgba(218, 165, 32, 0.28)"/>
    <path d="M 130,245 L 164,245 M 122,280 L 172,280 M 118,320 L 176,320 M 122,360 L 172,360 M 128,400 L 166,400"/>
    <path d="M 147,215 L 147,435" stroke-width="1.8"/>

    <!-- Ujung Kain & Kaki Wayang -->
    <path d="M 134,440 L 130,470 L 115,475 M 160,440 L 164,470 L 180,475"/>
    <circle cx="130" cy="466" r="3.5" fill="url(#goldPutri)"/>
    <circle cx="164" cy="466" r="3.5" fill="url(#goldPutri)"/>
  </g>
</svg>

